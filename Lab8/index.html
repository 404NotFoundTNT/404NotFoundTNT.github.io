<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <header>
      <h1>loja</h1>
      <nav>
        <ul>
          <li><a href="produtos">Produtos</a></li>
          <li><a href="cesto">Cesto</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h2>Selecione o seu produto</h2>
      <section id="filtros" aria-label="Filtrar e ordenar produtos">
        <label for="categoria">
          Filtrar
          <select id="categoria">
            <option value="">Todas as categorias</option>
          </select>
        </label>

        <label for="ordenar">
          Ordenar
          <select id="ordenar">
            <option value="">Ordenar pelo preço</option>
            <option value="decrescente">Preço Decrescente</option>
            <option value="crescente">Preço Crescente</option>
          </select>
        </label>

        <label for="pesquisa">
          Pesquisar
          <input
            type="search"
            id="pesquisa"
            placeholder="pesquise por produto"
          />
        </label>
      </section>
      <section id="produtos"></section>
      <section id="cesto">
        <h2>Produtos Selecionados</h2>
        <div id="produtos-selecionados"></div>

        <form id="checkout">
          <p id="total-cesto">Total: 0.00 €</p>

          <label for="estudante">
            És estudante do DEISI?
            <input type="checkbox" id="estudante" />
          </label>

          <label for="cupao">
            Cupão de desconto:
            <input type="text" id="cupao" />
          </label>

          <button type="submit" id="comprar">Comprar</button>

          <p id="mensagem-compra" role="status"></p>
          <p id="valor-final"></p>
          <p id="referencia"></p>
        </form>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
